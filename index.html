<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>蔥蔥旅行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --main:#39C5BB;
  --soft:color-mix(in srgb, var(--main) 14%, white);
  --soft2:color-mix(in srgb, var(--main) 28%, white);
  --deep:color-mix(in srgb, var(--main) 70%, #1d3b3a);
  --bg:#F5FBFA;
  --ink:#2E3A3A;
  --sub:#7A8B8A;
  --line:#E3EEEC;
  --pink:#FF8FAB;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Huninn','Noto Sans TC',system-ui,sans-serif;font-size:15px;line-height:1.5}
body{min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--deep)}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:110px;position:relative}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(8px);display:flex;align-items:center;gap:8px;padding:12px 16px}
.top h1{font-size:19px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:38px;height:38px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.06);display:grid;place-items:center;font-size:18px;flex:none}
.wrap{padding:0 16px}
.card{background:#fff;border-radius:var(--r);box-shadow:0 3px 14px rgba(40,80,78,.07);padding:16px;margin-bottom:14px}
.hero{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,var(--soft),#fff);border:2px solid var(--soft2)}
.hero .av{width:124px;height:128px;flex:none}
.bubble{background:#fff;border-radius:16px;padding:10px 12px;position:relative;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.bubble:before{content:"";position:absolute;left:-7px;top:18px;border:7px solid transparent;border-right-color:#fff;border-left:0}
.gimg{width:100%;height:100%;object-fit:contain;display:block}
.av svg{width:100%;height:100%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--main);color:#fff;border-radius:999px;padding:11px 18px;font-weight:700;box-shadow:0 4px 0 var(--deep);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--deep)}
.btn.ghost{background:#fff;color:var(--deep);box-shadow:0 0 0 2px var(--soft2) inset}
.btn.sm{padding:7px 12px;font-size:13px;box-shadow:0 3px 0 var(--deep)}
.btn.ghost.sm{box-shadow:0 0 0 2px var(--soft2) inset}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.muted{color:var(--sub);font-size:13px}
.tiny{font-size:12px;color:var(--sub)}
h2{font-size:17px;margin:4px 0 12px}
h3{font-size:15px;margin:0 0 8px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.trip-card{display:flex;gap:12px;align-items:center}
.trip-card .emoji{width:52px;height:52px;border-radius:16px;background:var(--soft);display:grid;place-items:center;font-size:26px;flex:none}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}
.inp{width:100%;border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff;outline:none}
.inp:focus{border-color:var(--main)}
textarea.inp{min-height:70px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:14px}
.chip.on{border-color:var(--main);background:var(--soft);color:var(--deep);font-weight:700}
.stepper{display:inline-flex;align-items:center;gap:4px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:3px}
.stepper button{width:32px;height:32px;border-radius:50%;background:var(--soft);font-size:18px;color:var(--deep)}
.stepper input{width:40px;text-align:center;border:0;outline:none;background:none;font-weight:700}
.tabs{display:flex;gap:6px;padding:4px 16px 10px;position:sticky;top:62px;z-index:15;background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(8px)}
.tab{flex:1;padding:9px 0;border-radius:14px;background:#fff;font-size:14px;color:var(--sub);box-shadow:0 2px 6px rgba(0,0,0,.04)}
.tab.on{background:var(--main);color:#fff;font-weight:700}
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 10px;scrollbar-width:none;position:sticky;top:115px;z-index:14;background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(8px)}
.days::-webkit-scrollbar{display:none}
.daychip{flex:none;background:#fff;border-radius:14px;padding:7px 12px;text-align:center;border:2px solid transparent;box-shadow:0 2px 6px rgba(0,0,0,.04)}
.daychip b{display:block;font-size:14px}
.daychip span{font-size:11px;color:var(--sub)}
.daychip.on{border-color:var(--main);background:var(--soft)}
.slot{margin-bottom:6px}
.slot-h{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);margin:10px 2px 6px}
.slot-h .add{margin-left:auto;width:26px;height:26px;border-radius:50%;background:var(--soft);color:var(--deep);font-size:16px}
.item{background:#fff;border-radius:16px;padding:12px;display:flex;gap:10px;box-shadow:0 2px 10px rgba(40,80,78,.06);width:100%;text-align:left}
.item .k{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:20px;flex:none}
.item .nm{font-weight:700;font-size:15px}
.item .ja{font-size:12px;color:var(--sub)}
.item .note{font-size:13px;margin-top:3px}
.item .tm{font-size:12px;color:var(--deep);font-weight:700}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--deep);margin-right:4px;vertical-align:1px}
.badge.pin{background:#FFF1C7;color:#8A6200}
.badge.vis{background:#FFE3EA;color:#B23A5B}
.badge.user{background:#EAF0FF;color:#3B5BB5}
.empty{width:100%;border:2px dashed var(--soft2);border-radius:16px;padding:14px;color:var(--deep);background:color-mix(in srgb, var(--soft) 50%, transparent);font-size:14px}
.leg{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0 6px 18px;padding:4px 0 4px 16px;border-left:3px dotted var(--soft2);font-size:12.5px;color:var(--sub)}
.leg .lm{color:var(--ink);font-weight:700}
.leg a,.leg .taxi{background:#fff;border-radius:999px;padding:2px 9px;text-decoration:none;font-size:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);color:var(--deep)}
.leg .est{font-size:11px;color:#B08A2E}
.leg .pp{font-weight:700;color:var(--deep)}
.leafmap{height:440px;border-radius:18px;overflow:hidden;z-index:0}
.leafmap .leaflet-attribution-flag{display:none!important}.leafmap svg{max-width:none}
.lpin{width:28px;height:28px;border-radius:50%;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.leg button.taxi{border:0;font:inherit;font-size:12px;cursor:pointer}
.leg-taxi{border-left-color:#F2B705}
.legparts{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:11.5px;color:var(--sub)}
.legparts span{background:var(--soft,#EAF7F5);border-radius:8px;padding:2px 7px}
.legparts i{font-style:normal;color:var(--sub)}
.daycost{background:#fff;border-radius:14px;padding:10px 12px;margin:0 0 12px;font-size:12.5px;line-height:1.8;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.daycost b{color:var(--deep)}
.daybar{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.hotel{display:flex;align-items:center;gap:8px}
.hotel input{flex:1;border:0;border-bottom:2px dashed var(--line);padding:6px 2px;outline:none;background:none}
.fab{position:fixed;right:max(16px, calc(50% - 224px));bottom:22px;z-index:30;display:flex;align-items:center;gap:8px;background:var(--main);color:#fff;border-radius:999px;padding:6px 18px 6px 6px;font-weight:700;box-shadow:0 5px 0 var(--deep),0 10px 24px rgba(0,0,0,.15)}
.fab .av{width:54px;height:54px;border-radius:50%;background:#fff;overflow:hidden;padding:2px}
.fab:active{transform:translateY(3px);box-shadow:0 2px 0 var(--deep)}
.fab-img{position:relative;margin:4px auto 0;width:230px;display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 6px 12px rgba(30,90,90,.22));animation:fabbob 2.4s ease-in-out infinite}
.fab-img .gwrap{width:100%;display:flex;justify-content:center;transition:transform .12s}
.fab-img .gwrap img{width:100%;display:block}
.fab-img .gwrap svg{height:140px;width:auto}
.fab-img[disabled]{opacity:.5;animation:none}
.fab-img .lbl{margin-top:4px;background:var(--main);color:#fff;font-weight:700;font-size:14px;padding:6px 14px;border-radius:999px;box-shadow:0 3px 0 var(--deep)}
.fab-img:active .gwrap{transform:translateY(6px) scale(.97)}
.fab-img:active .lbl{transform:translateY(2px);box-shadow:0 1px 0 var(--deep)}
@keyframes fabbob{50%{transform:translateY(-4px)}}
#app{padding-bottom:40px}
.sheet-bg{position:fixed;inset:0;background:rgba(30,50,50,.35);z-index:50;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;max-height:86vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;z-index:51;padding:18px 18px 28px;transform:translateY(105%);transition:transform .22s ease,visibility 0s .22s;visibility:hidden}
.sheet.open{transform:none;visibility:visible;transition:transform .22s ease}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:-6px auto 12px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:13px 12px;border-radius:14px;background:var(--bg);margin-bottom:8px}
.opt .e{font-size:22px;width:30px;text-align:center}
.opt b{display:block}
.opt span{font-size:12px;color:var(--sub)}
.opt.danger b{color:#C2410C}
.ai-bg{position:fixed;inset:0;background:rgba(245,251,250,.92);z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px;text-align:center}
.ai-bg .av{width:180px;height:180px;animation:bob 1.1s ease-in-out infinite}
.pbar-wrap{position:relative;width:min(300px,82vw);padding:14px 0 4px}
.pbar{height:16px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 2px var(--soft2,#DCEFEC);overflow:hidden}
.pfill{height:100%;width:0;border-radius:999px;background:var(--main);background-image:linear-gradient(45deg,rgba(255,255,255,.28) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.28) 50%,rgba(255,255,255,.28) 75%,transparent 75%);background-size:20px 20px;animation:pstripe .8s linear infinite;transition:width .25s linear}
@keyframes pstripe{to{background-position:20px 0}}
.puller{position:absolute;top:-1px;width:40px;height:40px;margin-left:-13px;transition:left .25s linear;animation:tug .5s ease-in-out infinite;pointer-events:none}
@keyframes tug{0%,100%{transform:translateX(0) rotate(-2deg)}50%{transform:translateX(3px) rotate(2deg)}}
.pinfo{display:flex;justify-content:space-between;margin-top:6px;font-size:13px;color:var(--sub)}
.pinfo b{color:var(--deep);font-size:15px}
@keyframes bob{50%{transform:translateY(-10px) rotate(-3deg)}}
.dots:after{content:"";animation:dots 1.4s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"．"}50%{content:"．．"}75%{content:"．．．"}}
.toast{position:fixed;left:50%;bottom:200px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.mapbox{background:#fff;border-radius:var(--r);overflow:hidden;box-shadow:0 3px 14px rgba(40,80,78,.07)}
.mapbox svg{display:block;width:100%;height:auto;touch-action:manipulation}
.legend{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px;font-size:12px}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:4px;vertical-align:middle}
.ov-day{padding:10px 0;border-bottom:1px dashed var(--line)}
.ov-day:last-child{border:0}
.ov-route{font-size:13.5px;line-height:1.8}
.dotn{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;margin-right:3px;vertical-align:-3px}
.big{font-size:28px;font-weight:700;color:var(--deep)}
.bar{height:10px;border-radius:9px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--main);border-radius:9px}
.costrow{display:grid;grid-template-columns:90px 1fr 76px;gap:8px;align-items:center;font-size:13.5px;margin:7px 0}
.costrow .v{text-align:right;font-weight:700}
.food{display:flex;flex-direction:column;gap:6px}
.food .links{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.linkbtn{font-size:12.5px;padding:5px 10px;border-radius:999px;background:var(--soft);color:var(--deep);text-decoration:none;font-weight:700}
.g-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.g-row:last-child{border:0}
.g-row .av{width:56px;height:56px;border-radius:16px;background:var(--soft);overflow:hidden;flex:none;padding:3px}
.swatch{width:14px;height:14px;border-radius:50%;display:inline-block;vertical-align:-2px;margin-right:4px}
.credit{font-size:11px;color:var(--sub);text-align:center;padding:8px 16px}
.note-box{background:#FFF8E6;border-radius:14px;padding:10px 12px;font-size:12.5px;color:#7A5B12}
.stream{white-space:pre-wrap;font-size:14px;line-height:1.7}
.hidden{display:none!important}
.vis-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.seg{display:inline-flex;background:var(--bg);border-radius:999px;padding:3px}
.seg button{padding:4px 10px;border-radius:999px;font-size:12px;color:var(--sub)}
.seg button.on{background:#fff;color:var(--deep);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.fare-grid{display:grid;grid-template-columns:1fr 64px 64px 64px 64px;gap:6px;align-items:center;font-size:12.5px}
.fare-grid input{width:100%;border:2px solid var(--line);border-radius:10px;padding:5px;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<div class="sheet-bg" id="sheetBg" data-act="closeSheet"></div>
<div class="sheet" id="sheet"></div>
<div class="ai-bg" id="aiBg">
  <div class="av" id="aiAv"></div>
  <div style="font-size:17px;font-weight:700" id="aiLabel" class="dots">思考中</div>
  <div class="pbar-wrap" id="pbarWrap"><div class="pbar"><div class="pfill" id="pFill"></div></div><img class="puller" id="pPuller" alt=""><div class="pinfo"><b id="pPct">0%</b><span id="pEta"></span></div></div>
  <div class="muted" id="aiSub">第一次使用會先詢問是否允許使用 Claude</div>
  <button class="btn ghost sm" data-act="aiStop">先停下來</button>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="fileInp" accept="image/*" class="hidden">

  /* 指定要吃的料理：把「每天拉麵」「一天晚餐鰻魚飯」分配到各天的餐，再找附近真的有在賣的店 */

  /* ---------- 3. 交通估算 ---------- */

  /**

  E.plan = function (pois, opts) {
    const nd = opts.days.length, pace = PACE_N[opts.pace] || PACE_N.normal, rule = GROUP_RULE[opts.group] || GROUP_RULE.young;
    const avoid = new Set((opts.avoid || []).map(s => String(s).trim()));
    const ok = p => !avoid.has(p.name) && !avoid.has(p.nameJa);
    const used = new Set(); (opts.days || []).forEach(d => Object.values(d.keep || {}).flat().forEach(it => { if (it.osm) used.add(it.osm); if (it.nameJa) used.add(it.nameJa); }));
    const interest = new Set([...(opts.interests || []), ...rule.boost]);
    const val = p => p.score + p.tags.filter(t => interest.has(t)).length * 3;

    const FOODY = /市場|横丁|横町|橫丁|食べ歩き|屋台|夜市/;
    pois.forEach(p => { if (p.kind !== 'food' && p.kind !== 'cafe' && FOODY.test(p.nameJa + p.name)) { p.kind = 'food'; p.market = true; } });
    const spots = pois.filter(p => p.kind !== 'food' && p.kind !== 'cafe' && ok(p) && !used.has(p.osm) && !used.has(p.nameJa)).sort((a, b) => val(b) - val(a));
    const foods = pois.filter(p => p.kind === 'food' && ok(p) && !p.night && !used.has(p.nameJa));
    // 有「在地市場」興趣時，午餐優先排有名的市場
    const markets = foods.filter(p => p.market && p.score >= 3);
    const bars = pois.filter(p => p.kind === 'food' && p.night && ok(p));
    const cafes = pois.filter(p => p.kind === 'cafe' && ok(p));

    // 每天需要幾個景點
    const need = opts.days.map(d => { const b = new Set(d.blocked || []); let n = 0; for (const k of ['morning', 'afternoon', 'evening']) if (!b.has(k) && !(d.keep && d.keep[k] && d.keep[k].length)) n += pace[k]; return n; });
    const total = need.reduce((a, b) => a + b, 0);
    // 一定要去的地方先放進候選
    const must = (opts.mustGo || []).filter(m => m && m.lat != null).map(m => ({ ...m, kind: m.kind || 'spot', score: 99, tags: [], must: true, osm: m.osm || ('must:' + m.name) }));
    // 每天的中心：住宿在當天城市附近就用住宿；住大阪、當天去京都（一日遊）就用京都
    const hasH = d => d.hotel && d.hotel.lat != null, hasC = d => d.city && d.city.lat != null;
    const anchor = opts.days.map(d => hasH(d) && (!hasC(d) || km(d.hotel, d.city) < 15) ? d.hotel : hasC(d) ? d.city : hasH(d) ? d.hotel : null);
    // 候選景點：每個住宿／城市附近各挑一批，避免某個城市被擠掉
    let pool;
    if (anchor.every(Boolean)) {
      const uniq = []; anchor.forEach((a, i) => { const u = uniq.find(u => km(u.a, a) < .3); if (u) u.need += need[i]; else uniq.push({ a, need: need[i] }); });
      const picked = new Set(must.map(m => m.osm)); pool = [...must];
      for (const u of uniq) spots.filter(p => !picked.has(p.osm) && km(u.a, p) < 12).slice(0, Math.max(u.need * 3, 8)).forEach(p => { picked.add(p.osm); pool.push(p); });
    } else pool = [...must, ...spots.slice(0, Math.max(total * 3, 15))];
    // 先依住宿／城市把天數分組，每組以那裡為中心分區；同一組內再細分給每一天
    const assign = new Array(pool.length).fill(0);
    if (anchor.every(Boolean)) {
      const groups = []; opts.days.forEach((d, i) => { const g = groups.find(g => km(g.h, anchor[i]) < .3); if (g) g.days.push(i); else groups.push({ h: anchor[i], days: [i] }); });
      const ga = kmeans(pool, groups.length, groups.map(g => g.h));
      groups.forEach((g, gi) => {
        const idx = pool.map((_, j) => j).filter(j => ga[j] === gi);
        if (g.days.length === 1) { idx.forEach(j => assign[j] = g.days[0]); return; }
        const sub = idx.length >= g.days.length ? kmeans(idx.map(j => pool[j]), g.days.length) : idx.map((_, k) => k % g.days.length);
        idx.forEach((j, k) => assign[j] = g.days[sub[k]]);
      });
    } else if (pool.length >= nd) kmeans(pool, nd).forEach((a, j) => assign[j] = a);
    else pool.forEach((_, j) => assign[j] = j % nd);

    // 每天挑分數最高的 need[i] 個（一定要去的優先）；不夠就向別天借最近的
    const byDay = Array.from({ length: nd }, () => []);
    pool.forEach((p, i) => byDay[assign[i]].push(p));
    const taken = new Set();
    // 白天（上午＋下午）和晚上分開挑，避免夜景點佔掉白天的名額
    const needOf = (i, ks) => { const d = opts.days[i], b = new Set(d.blocked || []); return ks.reduce((n, k) => n + (!b.has(k) && !(d.keep && d.keep[k] && d.keep[k].length) ? pace[k] : 0), 0); };
    const chosen = byDay.map((arr, i) => {
      const s = arr.sort((a, b) => (b.must ? 999 : val(b)) - (a.must ? 999 : val(a)));
      const nDay = needOf(i, ['morning', 'afternoon']), nEve = needOf(i, ['evening']);
      const dayP = s.filter(p => p.must || !p.night).slice(0, nDay), eveP = s.filter(p => p.night && !p.must).slice(0, nEve);
      let pick = [...dayP, ...eveP];
      if (pick.length < need[i]) pick = pick.concat(s.filter(p => !pick.includes(p) && (nDay > dayP.length ? !p.night : true)).slice(0, need[i] - pick.length));
      pick.forEach(p => taken.add(p.osm)); return pick;
    });
    chosen.forEach((arr, i) => {
      const c = anchor[i] || arr[0] || opts.center;
      while (arr.length < need[i]) {
        const dayShort = arr.filter(p => !p.night).length < needOf(i, ['morning', 'afternoon']);
        const rest = pool.concat(spots).filter(p => !taken.has(p.osm) && km(c, p) < 15 && (!dayShort || !p.night)); if (!rest.length) break;
        rest.sort((a, b) => km(c, a) - km(c, b)); arr.push(rest[0]); taken.add(rest[0].osm);
      }
    });

    let uid = 0; const mk = (p, extra) => ({ id: 'o' + Date.now().toString(36) + (uid++), name: p.name, nameJa: p.nameJa, kind: p.kind, lat: p.lat, lng: p.lng, stay: stayOf(p, rule), cost: costOf(p), note: noteOf(p), osm: p.osm, wikidata: p.wikidata || '', wikipedia: p.wikipedia || '', hours: p.hours || '', src: 'osm', ...(extra || {}) });
    const usedFood = new Set();
    const SLOT_TXT = { lunch: ['午餐', 'ランチ ', 60, 1500, 'food'], dinner: ['晚餐', '夕食 ', 60, 2500, 'food'], breakfast: ['早餐', '朝食 ', 40, 700, 'food'], snack: ['點心', 'カフェ スイーツ ', 30, 900, 'cafe'], late: ['宵夜', 'ラーメン ', 45, 1200, 'food'], arcade: ['電玩', 'ゲームセンター ', 45, 1000, 'shop'] };
    const nearMeal = (k, at) => { if (!at || at.lat == null) return null; const nm = at.nameJa || at.name || ''; const t = SLOT_TXT[k]; return { id: 'o' + (uid++), name: t[0] + '：' + (at.name || nm) + '附近', kind: t[4], lat: at.lat, lng: at.lng, stay: t[2], cost: t[3], note: '點「在 Google 地圖打開」看附近的店', mapq: t[1] + nm, mealType: k, src: 'osm' }; };
    const foodNear = (at) => foods.some(f => !usedFood.has(f.osm) && km(at, f) < 1.5);
    const pickBest = (list, at, avoidSet, maxKm = 1.5) => {   // 附近有名的店優先，沒有再挑最近的
      const near = list.filter(f => !avoidSet.has(f.osm) && km(at, f) < maxKm);
      if (!near.length) return null;
      near.sort((a, b) => (b.score - a.score) || (km(at, a) - km(at, b)));
      avoidSet.add(near[0].osm); return near[0];
    };
    const pickNear = (list, at, avoidSet) => { let best = null, bd = 1e9; for (const f of list) { if (avoidSet.has(f.osm)) continue; const d = km(at, f) - (f.cuisine ? .15 : 0); if (d < bd) { bd = d; best = f; } } if (best) avoidSet.add(best.osm); return best; };

    const out = opts.days.map((d, i) => {
      const b = new Set(d.blocked || []), keep = d.keep || {};
      const start = anchor[i] || opts.center;
      const nightish = chosen[i].filter(p => p.night), dayish = chosen[i].filter(p => !p.night);
      const order = nearestOrder(start, dayish);
      const slots = {}; SLOT_KEYS.forEach(k => slots[k] = (keep[k] || []).slice());
      for (const k of ['morning', 'afternoon']) if (!b.has(k) && !slots[k].length) slots[k] = order.splice(0, pace[k]).map(p => mk(p));
      // 剩下白天點往下午塞
      if (order.length && !b.has('afternoon')) slots.afternoon.push(...order.splice(0).map(p => mk(p)));
      if (!b.has('evening') && !slots.evening.length) {
        let ev = nightish.slice(0, pace.evening).map(p => mk(p));
        const lastPt = slots.afternoon.at(-1) || slots.morning.at(-1) || start;
        if (!ev.length && rule.nightBar) { const bar = pickNear(bars, lastPt, usedFood); if (bar) ev = [mk(bar, { note: '晚上小酌' })]; }
        if (!ev.length) { const nv = spots.filter(p => p.night && !taken.has(p.osm) && km(lastPt, p) < 8).sort((a, c) => km(lastPt, a) - km(lastPt, c))[0]; if (nv) { taken.add(nv.osm); ev = [mk(nv)]; } }
        if (!ev.length && order.length) ev = [mk(order.shift())];
        if (!ev.length && d.hotel) ev = [{ id: 'o' + (uid++), name: '回住宿休息', kind: 'spot', lat: d.hotel.lat, lng: d.hotel.lng, stay: 60, cost: 0, note: '早點休息，明天再出發', src: 'auto' }];
        slots.evening = ev;
      }
      // 午餐、晚餐：挑在前一個點附近的真實餐廳
      if (!b.has('lunch') && !slots.lunch.length) {
        const at = slots.morning.at(-1) || start;
        const mk1 = markets.filter(m => !usedFood.has(m.osm) && km(at, m) < 4);
        const f = (interest.has('market') || interest.has('food')) && mk1.length ? (usedFood.add(mk1[0].osm), mk1[0]) : (foodNear(at) ? pickBest(foods.filter(x => !x.market), at, usedFood) : null);
        if (f) slots.lunch = [mk(f, { stay: f.market ? 90 : 60 })]; else { const m = nearMeal('lunch', at); if (m) slots.lunch = [m]; }
      }
      if (!b.has('dinner') && !slots.dinner.length) {
        if (d.hotel && /旅館|ryokan|onsen/i.test(d.hotel.type || d.hotel.name || '')) slots.dinner = [{ id: 'o' + (uid++), name: '旅館晚餐', kind: 'food', lat: d.hotel.lat, lng: d.hotel.lng, stay: 90, cost: 0, note: '住宿附的晚餐', src: 'auto' }];
        else { const at = slots.afternoon.at(-1) || slots.morning.at(-1) || start; const f = foodNear(at) ? pickBest(foods.filter(x => !x.market), at, usedFood) : null; if (f) slots.dinner = [mk(f, { stay: 75 })]; else { const m = nearMeal('dinner', at); if (m) slots.dinner = [m]; } }
      }
      // 下午點太多時插一間咖啡廳休息（長輩、悠閒）
      if ((rule.slower || opts.pace === 'slow') && slots.afternoon.length >= 2) { const c = pickNear(cafes, slots.afternoon[0], usedFood); if (c) slots.afternoon.splice(1, 0, mk(c, { stay: 40, note: '中途休息喝杯咖啡' })); }
      // 照喜好加排：早餐（上午最前面）、下午點心、晚上電玩、宵夜
      const want = k => interest.has(k);
      if (want('breakfast') && !b.has('morning')) { const m = nearMeal('breakfast', start); if (m) slots.morning.unshift(m); }
      if (want('sweets') && !b.has('afternoon') && slots.afternoon.length) { const at = slots.afternoon[Math.min(1, slots.afternoon.length - 1)]; const m = nearMeal('snack', at); if (m) slots.afternoon.splice(Math.min(2, slots.afternoon.length), 0, m); }
      if (want('arcade') && !b.has('evening')) { const at = slots.evening.at(-1) || slots.dinner.at(-1) || start; const m = nearMeal('arcade', at); if (m) slots.evening.push(m); }
      if (want('late') && !b.has('evening')) { const at = slots.evening.at(-1) || slots.dinner.at(-1) || start; const m = nearMeal('late', at); if (m) slots.evening.push(m); }
      // 不留白：空的時段先從同一天別的時段勻一個，再找附近沒用過的景點，最後才放「散步」
      for (const k of ['morning', 'afternoon', 'evening']) {
        if (b.has(k) || slots[k].length) continue;
        const donor = ['morning', 'afternoon'].filter(x => x !== k && slots[x].length >= 2 && !slots[x].every(i => i.must))[0];
        if (donor && k !== 'evening') { slots[k].push(donor === 'morning' && k === 'afternoon' ? slots[donor].pop() : slots[donor].shift()); continue; }
        const at = Object.values(slots).flat().filter(x => x.lat != null).at(-1) || start;
        const cand = (k === 'evening' ? spots.filter(p => p.night) : []).concat(spots).filter(p => !taken.has(p.osm) && at && km(at, p) < 12).sort((a, c) => km(at, a) - km(at, c))[0];
        if (cand) { taken.add(cand.osm); slots[k] = [mk(cand)]; continue; }
        if (k === 'evening' && d.hotel) { slots[k] = [{ id: 'o' + (uid++), name: '回住宿休息', kind: 'spot', lat: d.hotel.lat, lng: d.hotel.lng, stay: 60, cost: 0, note: '早點休息，明天再出發', src: 'auto' }]; continue; }
        if (at && at.lat != null) { const nm = (d.city && d.city.name) || at.name || ''; slots[k] = [{ id: 'o' + (uid++), name: (k === 'evening' ? '晚上自由活動：' : '自由散步：') + nm + '一帶（第' + (opts.days.indexOf(d) + 1) + '天）', kind: 'spot', lat: at.lat, lng: at.lng, stay: 90, cost: 0, note: '點「在 Google 地圖打開」看附近有什麼', mapq: '観光スポット ' + nm, src: 'osm' }]; }
      }
      // 交通
      let prev = d.hotel ? { lat: d.hotel.lat, lng: d.hotel.lng } : null;
      for (const k of SLOT_KEYS) for (const it of slots[k]) { if (prev && it.lat != null && !it.leg) it.leg = E.estimateLeg(prev, it); if (it.lat != null) prev = it; }
      return { slots };
    });
    return { days: out, candidates: pool.length };
  };

  function stayOf(p, rule) {
    const tg = p.tags || [];
    let m = 60;
    if (p.kind === 'food') m = p.market ? 60 : 60; else if (p.kind === 'cafe') m = 30;
    else if (p.mall) m = 120; else if (p.kind === 'shop') m = 60; else if (p.kind === 'onsen') m = 90;
    else if (p.big || tg.includes('kids')) m = 120;
    else if (tg.includes('history')) m = 50; else if (tg.includes('art')) m = 60; else if (p.night) m = 60;
    return rule.slower ? Math.round(m * 1.2) : m;
  }
  function costOf(p) {
    if (p.kind === 'food') return p.night ? 3000 : p.market ? 2000 : 1500;
    if (p.kind === 'cafe') return 800;
    if (p.kind === 'onsen') return 1000;
    const tg = p.tags || [];
    if (tg.includes('art') || tg.includes('kids')) return tg.includes('kids') ? 2500 : 1200;
    return 0;
  }
  const CUISINE = { ramen: '拉麵', sushi: '壽司', tempura: '天婦羅', sukiyaki: '壽喜燒', shabu_shabu: '涮涮鍋', 'shabu shabu': '涮涮鍋', yakiniku: '燒肉', yakitori: '串燒', udon: '烏龍麵', soba: '蕎麥麵', tonkatsu: '豬排', japanese: '日式料理', chinese: '中華料理', korean: '韓式', italian: '義式', french: '法式', curry: '咖哩', okonomiyaki: '大阪燒', takoyaki: '章魚燒', seafood: '海鮮', beef_bowl: '牛丼', 'beef bowl': '牛丼', burger: '漢堡', pizza: '披薩', coffee_shop: '咖啡', cake: '蛋糕甜點', donburi: '丼飯', unagi: '鰻魚飯', kaiseki: '懷石料理', izakaya: '居酒屋', noodle: '麵食', steak: '牛排', gyoza: '餃子', crab: '螃蟹', fish: '魚料理', regional: '鄉土料理', international: '各國料理', western: '洋食', asian: '亞洲料理', bbq: '燒烤', ice_cream: '冰淇淋' };
  E.cuisineZh = c => String(c || '').split(';').map(x => x.trim()).filter(Boolean).map(x => CUISINE[x] || CUISINE[x.replace(/ /g, '_')] || x).slice(0, 2).join('・');
  function noteOf(p) {
    if (p.kind === 'food' || p.kind === 'cafe') return p.cuisine ? E.cuisineZh(p.cuisine) : (p.market ? '邊走邊吃的市場' : '');
    const t = { history: '歷史景點', nature: '公園綠地', art: '博物館／美術館', kids: '親子景點', shopping: '逛街', onsen: '泡湯', night: '夜景' };
    return (p.tags || []).map(x => t[x]).filter(Boolean).slice(0, 2).join('・');
  }

  /* ---------- 5. 維基百科簡介（優先中文，沒有就日文） ---------- */
  E.wiki = async function (item) {
    try {
      let lang = 'ja', title = '';
      if (item.wikidata) {
        const j = await getJSON(`https://www.wikidata.org/wiki/Special:EntityData/${item.wikidata}.json`, { timeout: 12000 });
        const sl = j.entities && Object.values(j.entities)[0].sitelinks || {};
        if (sl.zhwiki) { lang = 'zh'; title = sl.zhwiki.title; } else if (sl.jawiki) { title = sl.jawiki.title; }
      }
      if (!title && item.wikipedia) { const m = item.wikipedia.split(':'); lang = m[0]; title = m.slice(1).join(':'); }
      if (!title) return null;
      const j = await getJSON(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`, { timeout: 12000, headers: lang === 'zh' ? { 'accept-language': 'zh-tw' } : undefined });
      return { text: (j.extract || '').slice(0, 220), img: j.thumbnail && j.thumbnail.source || '', url: j.content_urls && j.content_urls.mobile && j.content_urls.mobile.page || '', lang };
    } catch (e) { return null; }
  };

  /* ---------- 6. 天氣（Open-Meteo，只有 16 天內） ---------- */
  E.weather = async function (c, startDate, nDays) {
    try {
      const s = new Date(startDate); const diff = (s - new Date()) / 864e5; if (isNaN(diff) || diff > 15 || diff < -1) return null;
      const end = new Date(s.getTime() + (nDays - 1) * 864e5).toISOString().slice(0, 10);
      const j = await getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lng}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo&start_date=${startDate}&end_date=${end}`, { timeout: 12000 });
      const d = j.daily; if (!d) return null;
      return d.time.map((t, i) => ({ date: t, icon: wIcon(d.weather_code[i]), max: Math.round(d.temperature_2m_max[i]), min: Math.round(d.temperature_2m_min[i]), rain: d.precipitation_probability_max[i] }));
    } catch (e) { return null; }
  };
  function wIcon(c) { return c <= 1 ? '☀️' : c <= 3 ? '⛅' : c <= 48 ? '🌫️' : c <= 67 ? '🌧️' : c <= 77 ? '❄️' : c <= 82 ? '🌦️' : '⛈️'; }

  /* ---------- 7. AI 加強：只准從真實候選裡挑 ---------- */
  // ask(prompt) → 回傳 JSON（由 App 的 askJSON 提供）。失敗就回 null，App 直接用演算法結果。
  E.aiEnhance = async function (ask, base, pois, opts) {
    const cand = [];
    const add = p => { if (!cand.some(c => c.osm === p.osm)) cand.push(p); };
    base.days.forEach(d => Object.values(d.slots).flat().forEach(it => it.osm && add(it)));
    pois.filter(p => p.kind !== 'cafe').sort((a, b) => b.score - a.score).slice(0, 70).forEach(add);
    const ids = new Map(cand.map((p, i) => ['p' + i, p]));
    const list = [...ids].map(([id, p]) => `${id}|${p.nameJa}|${p.kind}${p.night ? '/夜' : ''}|${p.lat.toFixed(3)},${p.lng.toFixed(3)}${p.cuisine ? '|' + p.cuisine : ''}`).join('\n');
    const dayTxt = opts.days.map((d, i) => `Day${i + 1}：住宿 ${d.hotel ? d.hotel.name : '市區'}；不能排的時段 ${[...(d.blocked || [])].join(',') || '無'}`).join('\n');
    const prompt = `你是日本旅遊嚮導。下面是從 OpenStreetMap 抓到的「真實存在」地點清單（id|日文名|類型|座標|料理）。
請只用清單裡的 id 排 ${opts.days.length} 天行程，不可以自己發明地點。
旅伴：${opts.groupLabel || opts.group}；步調：${opts.pace}；興趣：${(opts.interests || []).join('、') || '不限'}。${opts.wish ? '\n旅客自己的要求（請盡量照做）：' + opts.wish : ''}
${dayTxt}
規則：同一天的地點要在附近；lunch、dinner 要放 food；每個沒被禁止的時段至少 1 個；每個地點附 15 字內繁體中文推薦語。
清單：
${list}
只回傳 JSON：{"days":[{"morning":[{"id":"p1","tip":"推薦語"}],"lunch":[],"afternoon":[],"dinner":[],"evening":[]}]}`;
    let r;
    try { r = await ask(prompt); } catch (e) { E.log('ai fail', e); return { plan: base, ai: false, error: e }; }

    const usedAll = new Set();
    const spare = (k, near) => {   // 找一個沒用過、類型對的真實地點補位
      const wantFood = k === 'lunch' || k === 'dinner';
      const c = cand.filter(p => !usedAll.has(p.osm) && !aiPicked.has(p.osm) && (wantFood ? p.kind === 'food' && !p.night : k === 'evening' ? p.night : p.kind !== 'food'));
      if (!c.length) return null; if (near) c.sort((a, b) => km(near, a) - km(near, b)); return c[0];
    };
    const days = base.days.map((bd, i) => {
      const ad = r.days[i] || {}, b = new Set(opts.days[i].blocked || []), slots = {};
      for (const k of SLOT_KEYS) {
        const keep = (opts.days[i].keep || {})[k];
        if (keep && keep.length) { slots[k] = keep.slice(); continue; }
        const arr = (Array.isArray(ad[k]) ? ad[k] : []).map(x => { const p = ids.get(x && x.id); if (!p) { bad++; return null; } if (usedAll.has(p.osm)) return null; usedAll.add(p.osm); return { ...toItem(p, uid++), note: String(x.tip || '').slice(0, 40) || noteOf(p), aiTip: true }; }).filter(Boolean);
        if (b.has(k)) { slots[k] = []; continue; }
        if (arr.length) { slots[k] = arr; continue; }

        let fb = (bd.slots[k] || []).filter(it => !it.osm || (!aiPicked.has(it.osm) && !usedAll.has(it.osm)));
        fb.forEach(it => it.osm && usedAll.add(it.osm));
        if (!fb.length) { const prevIt = Object.values(slots).flat().filter(x => x.lat != null).at(-1) || opts.days[i].hotel; const p = spare(k, prevIt); if (p) { usedAll.add(p.osm); fb = [{ ...toItem(p, uid++), note: noteOf(p) }]; } }
        slots[k] = fb;
      }

  // 把天數依序分給各城市（大阪+京都+神戸 5 天 → 2,2,1）
  E.cityDays = function (n, k) { const out = []; for (let i = 0; i < n; i++) out.push(Math.min(k - 1, Math.floor(i * k / n))); return out; };

    if (!all.length) throw (lists.find(l => l.status === 'rejected') || {}).reason || { code: 'no_data' };
    all.foodOK = lists.some(l => l.status === 'fulfilled' && l.value.foodOK);

  };
  E.run = async function (opts, { ask, onStep = () => {} } = {}) {

    const r = await E.aiEnhance(ask, base, pois, opts);

  };

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
const isNum=v=>typeof v==='number'&&isFinite(v);
const yen=n=>'¥'+Math.round(n||0).toLocaleString('ja-JP');
const r10=n=>Math.round(n/10)*10;
const enc=encodeURIComponent;
const norm=s=>String(s||'').replace(/\s|　/g,'').toLowerCase();
function hm(m){m=Math.round(m);const h=Math.floor(m/60)%24,mm=m%60;return String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0');}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2400);}
function km(a,b){if(!a||!b||!isNum(a.lat)||!isNum(b.lat)||!isNum(a.lng)||!isNum(b.lng))return null;const R=6371,dLa=(b.lat-a.lat)*Math.PI/180,dLo=(b.lng-a.lng)*Math.PI/180;const x=Math.sin(dLa/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
function regionOf(dest){dest=dest||'';if(/東京|tokyo|新宿|澀谷|渋谷|淺草|浅草/i.test(dest))return 'tokyo';if(/大阪|osaka|難波|梅田/i.test(dest))return 'osaka';if(/京都|kyoto/i.test(dest))return 'kyoto';return 'other';}
function dayDate(t,i){if(!t.startDate)return '';const d=new Date(t.startDate+'T00:00:00');d.setDate(d.getDate()+i);return (d.getMonth()+1)+'/'+d.getDate()+' ('+'日一二三四五六'[d.getDay()]+')';}
function dayDateObj(t,i){if(!t.startDate)return null;const d=new Date(t.startDate+'T00:00:00');d.setDate(d.getDate()+i);return d;}
function apPt(code,id){const a=AIRPORTS[code];return a?{id,name:a[0],nameJa:a[1],lat:a[2],lng:a[3],ap:true}:null;}
function toMin(x){const m=/^(\d{1,2}):(\d{2})/.exec(x||'');return m?(+m[1])*60+(+m[2]):null;}
function hasArr(t){const a=t.flights&&t.flights.arr;return !!(a&&AIRPORTS[a.ap]);}
function hasDep(t){const d=t.flights&&t.flights.dep;return !!(d&&AIRPORTS[d.ap]&&toMin(d.time)!=null);}
function stayList(t){return t.stays||(t.stays=[]);}
function nightStay(t,k){let r=null;for(const x of stayList(t)){if(k>=x.from&&k<x.from+x.nights)r=x;}return r;}
function stayEmoji(x){return (STAY_TYPES[x.type]||STAY_TYPES.hotel)[0];}
function stayPt(x){return x&&isNum(x.lat)?{id:'stay-'+x.id,name:x.name,nameJa:x.nameJa||x.name,lat:x.lat,lng:x.lng,isStay:true}:null;}
function startInfo(t,day){
  const i=t.days.indexOf(day);
  if(i===0&&hasArr(t))return {kind:'air',pt:apPt(t.flights.arr.ap,'air-arr'),label:'🛬 '+AIRPORTS[t.flights.arr.ap][0]+'（下飛機後）',origin:AIRPORTS[t.flights.arr.ap][1]};
  const x=i>0?nightStay(t,i-1):null;
  if(x)return {kind:'stay',stay:x,pt:stayPt(x),label:stayEmoji(x)+' '+x.name,origin:x.nameJa||x.name};
  if(day.hotel)return {kind:'text',pt:null,label:'🏨 '+day.hotel,origin:day.hotel};
  const tv=travelOf(t,i);
  if(tv)return {kind:'city',pt:{id:'city-'+i,name:tv.fromName,lat:tv.from.lat,lng:tv.from.lng},label:'🚄 從 '+tv.fromName+' 出發（前一晚住的城市）',origin:tv.fromName};
  return null;
}
function startPt(t,day){const x=startInfo(t,day);return x&&x.pt?x.pt:null;}
function startPrev(t,day){const x=startInfo(t,day);if(!x)return null;if(x.pt)return x.pt;return {id:'start-text',name:x.origin,nameJa:x.origin};}
function endInfo(t,day){
  const i=t.days.indexOf(day);if(i===t.days.length-1&&hasDep(t))return null;
  const x=nightStay(t,i);if(!x)return null;
  const its=dayItems(day);const last=its[its.length-1]||null;const pt=stayPt(x);let leg=null;
  if(last&&pt)leg=(day.endLeg&&day.endLeg.fromId===last.id&&day.endLeg.toStay===x.id)?day.endLeg:localLeg(last,pt);
  const times=computeTimes(t,day);
  return {stay:x,pt,last,leg,arrive:last&&leg?times._end+leg.minutes:null};
}
function cityIdx(t,cities){
  const cs=cities||t.cities||[];
  if(t.dayCity&&t.dayCity.length===t.days.length&&cs.length){const key=x=>{const h=JP_PLACES.find(x);return h?h.name:x;};
    const ks=cs.map(c=>key(c.name));return t.dayCity.map(n=>Math.max(0,ks.indexOf(key(n))));}
  return NegiOSM.cityDays(t.days.length,Math.max(1,cs.length));
}
function travelOf(t,i){
  if(!t.cities||t.cities.length<2||i<=0||!window.NegiOSM)return null;
  const cd=cityIdx(t);if(cd[i]===cd[i-1])return null;
  const st=nightStay(t,i-1),to=t.cities[cd[i]];
  const from=st&&isNum(stayPt(st)?.lat)?Object.assign({},stayPt(st),{found:st.name}):t.cities[cd[i-1]];
  if(!from||!to||!isNum(from.lat)||!isNum(to.lat))return null;
  const k=NegiOSM.km(from,to);const lg=localLeg(from,to);
  return {from,to,km:k,minutes:lg.minutes,fromName:from.found||from.name,toName:to.found||to.name};
}
function blockedSlots(t,i){
  const b=new Set();const SL_END={morning:690,lunch:840,afternoon:1050,dinner:1170,evening:1320};const SL_START={morning:540,lunch:690,afternoon:810,dinner:1050,evening:1170};
  if(i===0&&hasArr(t)&&toMin(t.flights.arr.time)!=null){const ready=toMin(t.flights.arr.time)+60;for(const k of SLOT_KEYS)if(ready>=SL_END[k]-30)b.add(k);}
  const tv=travelOf(t,i);if(tv&&tv.km>120){b.add('morning');if(tv.minutes>300)b.add('lunch');}
  if(i===t.days.length-1&&hasDep(t)){const dl=toMin(t.flights.dep.time)-(t.flights.dep.type==='dom'?60:120)-45;for(const k of SLOT_KEYS)if(dl<=SL_START[k]+30)b.add(k);}
  return b;
}
function dayBase(t,day){
  let m={slow:540,normal:510,packed:480}[t.pace]||510;
  const st=toMin(day.startTime);if(st!=null)m=st;
  if(t.days[0]===day&&hasArr(t)&&toMin(t.flights.arr.time)!=null)m=Math.max(toMin(t.flights.arr.time)+60,st!=null?st:0);
  return m;
}
function isFoody(it){if(it.kind==='food')return true;if(it.kind==='shop'||it.kind==='cafe')return false;return FOODY.test((it.name||'')+(it.nameJa||''));}
function depInfo(t){
  if(!hasDep(t))return null;
  const day=t.days[t.days.length-1];const its=dayItems(day);const last=its[its.length-1]||null;const ap=apPt(t.flights.dep.ap,'dep');
  const leg=last?localLeg(last,ap):null;const buf=t.flights.dep.type==='dom'?60:120;const deadline=toMin(t.flights.dep.time)-buf;
  const times=computeTimes(t,day);const arrive=last&&leg?times._end+leg.minutes:null;
  return {day,last,ap,leg,deadline,arrive,buf,late:arrive!=null&&arrive>deadline};
}

function parseLoose(t){
  try{return JSON.parse(t);}catch(e){}
  const m=/```(?:json)?\s*([\s\S]*?)```/.exec(t);if(m){try{return JSON.parse(m[1]);}catch(e){}}
  const a=[t.indexOf('{'),t.indexOf('[')].filter(i=>i>=0);const b=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'));
  if(a.length&&Math.min(...a)<b){try{return JSON.parse(t.slice(Math.min(...a),b+1));}catch(e){}}
  throw {code:'invalid_json',text:t};
}
function httpErr(st,body){let msg=body;try{const j=JSON.parse(body);msg=(j.error&&(j.error.message||j.error.status))||body;}catch(e){}msg='HTTP '+st+'：'+String(msg).slice(0,240);
  if(st===429)return {code:'rate_limited',message:msg};if(st===401||st===403||(st===400&&/api.?key|credential|auth/i.test(body)))return {code:'bad_key',message:msg};if(st===404)return {code:'bad_model',message:msg};return {code:'upstream_error',message:msg};}

const nativePending={};
window.__negiNativeDone=(id,status,body)=>{const p=nativePending[id];if(p){delete nativePending[id];p(status,body);}};
function hasNative(){return !!(window.NegiNative&&window.NegiNative.request);}
function httpPost(url,headers,body,signal){
  if(hasNative())return new Promise((res,rej)=>{
    const id='r'+uid();
    nativePending[id]=(st,b)=>{if(st<0){fetch(url,{method:'POST',signal,headers,body}).then(res).catch(e=>rej({code:'network',message:'手機連線失敗：'+String(b).slice(0,160)+'；備用連線也失敗：'+String(e&&e.message||e).slice(0,80)}));}else res({ok:st>=200&&st<300,status:st,text:async()=>b});};
    if(signal){if(signal.aborted){delete nativePending[id];return rej({name:'AbortError'});}signal.addEventListener('abort',()=>{if(nativePending[id]){delete nativePending[id];rej({name:'AbortError'});}},{once:true});}
    try{window.NegiNative.request(id,'POST',url,JSON.stringify(headers),body);}catch(e){delete nativePending[id];rej({code:'network',message:String(e)});}
  });

}
function timedSignal(outer,ms){const c=new AbortController();const t=setTimeout(()=>c.abort('timeout'),ms);if(outer){if(outer.aborted)c.abort();else outer.addEventListener('abort',()=>c.abort(),{once:true});}return {signal:c.signal,done:()=>clearTimeout(t),isTimeout:()=>c.signal.reason==='timeout'};}
async function apiCall(prompt,{json=false,signal,timeout=90000,search=false}={}){
  const c=aiCfg();if(!c.key)throw {code:'no_key'};
  const ts=timedSignal(signal,timeout);
  try{
    signal=ts.signal;
    if(c.provider==='claude'){
      const r=await httpPost('https://api.anthropic.com/v1/messages',{'content-type':'application/json','x-api-key':c.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        JSON.stringify(Object.assign({model:cleanModel(c.model)||'claude-sonnet-5-5',max_tokens:8000,messages:[{role:'user',content:prompt+(json?'\n\n只輸出 JSON，不要任何其他文字。':'')}]},search?{tools:[{type:'web_search_20250305',name:'web_search',max_uses:3}]}:{})),signal);
      const body=await r.text();if(!r.ok)throw httpErr(r.status,body);
      const d=JSON.parse(body);const txt=(d.content||[]).map(x=>x.text||'').join('');if(!txt.trim())throw {code:'empty_completion'};return txt;
    }
    const user=cleanModel(c.model);
    const list=user?[user]:[...new Set([c.autoModel,...GEMINI_MODELS].filter(Boolean))];
    let lastErr=null;
    for(const model of list){
      const r=await httpPost('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent',{'content-type':'application/json','x-goog-api-key':c.key},
        JSON.stringify(Object.assign({contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:json&&!search?{responseMimeType:'application/json'}:{}},search?{tools:[{google_search:{}}]}:{})),signal);
      let body=await r.text();
      if(!r.ok&&(r.status===401||r.status===403)&&/ACCESS_TOKEN_TYPE_UNSUPPORTED|UNAUTHENTICATED/i.test(body)){
        // 新格式（AQ.）金鑰在部分帳號用標頭會被拒，改用網址帶金鑰再試一次
        const r2=await httpPost('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent?key='+encodeURIComponent(c.key),{'content-type':'application/json'},
          JSON.stringify(Object.assign({contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:json&&!search?{responseMimeType:'application/json'}:{}},search?{tools:[{google_search:{}}]}:{})),signal);
        const b2=await r2.text();if(r2.ok){body=b2;}else{throw httpErr(r2.status,b2);}
      }else if(!r.ok){lastErr=httpErr(r.status,body);
        // 找不到模型、太忙（503/500）、這個模型額度用完（429）→ 自動換下一個模型
        if(!user&&(lastErr.code==='bad_model'||r.status===429||r.status>=500))continue;throw lastErr;}
      if(!user&&c.autoModel!==model){c.autoModel=model;setAiCfg(c);}
      const d=JSON.parse(body);const txt=(((d.candidates||[])[0]||{}).content?.parts||[]).map(x=>x.text||'').join('');
      if(!txt.trim())throw {code:'empty_completion',message:'AI 沒有回覆內容：'+String(body).slice(0,200)};return txt;
    }
    throw lastErr||{code:'bad_model'};
  }catch(e){
    if(ts.isTimeout())throw {code:'timeout',message:'等了 '+Math.round(timeout/1000)+' 秒都沒有回應'};
    if(e&&e.name==='AbortError')throw {code:'cancelled'};if(e&&e.code)throw e;throw {code:'network',message:String(e&&e.message||e)};
  }finally{ts.done();}
}

function progStep(label,from,to,exp=5,after){if(!PROG.on)return;
  Object.assign(PROG,{from:Math.max(PROG.p,from),to:Math.max(from+1,to),st:Date.now(),exp:Math.max(.5,exp),after:after!=null?after:(PROG.after||0)});

function progFmt(sec){return sec<=5?'再幾秒就好':sec<60?'大約還要 '+(Math.ceil(sec/5)*5)+' 秒':'大約還要 '+Math.ceil(sec/60)+' 分鐘';}
function progDraw(){if(!PROG.on)return;
  const el=(Date.now()-PROG.st)/1000,r=el/PROG.exp;
  const frac=r<1?r*.9:.9+.08*(1-Math.exp(-(r-1)));   // 超過平常時間就放慢，不會跑到底
  PROG.p=Math.max(PROG.p,Math.min(99,PROG.from+(PROG.to-PROG.from)*frac));const p=PROG.p;
  const f=$('#pFill'),pu=$('#pPuller'),pc=$('#pPct'),eta=$('#pEta');if(!f)return;
  f.style.width=p+'%';pu.style.left=p+'%';pc.textContent=Math.floor(p)+'%';

/* ===================== 交通估算 ===================== */
/* 大眾運輸粗估（每人）：市區地鐵按距離分段；中距離 JR／私鐵；長距離新幹線（含到車站的地鐵） */
function cityFare(r){return r<=3?190:r<=7?240:r<=13?290:r<=19?340:390;}
function legOf(parts){const main=parts.reduce((x,y)=>(y.minutes>x.minutes?y:x),parts[0]);return {mode:main.mode,line:main.line||'',minutes:parts.reduce((s,p)=>s+p.minutes,0),fare:parts.reduce((s,p)=>s+p.fare,0),parts,src:'est'};}
function localLeg(a,b){
  const d=km(a,b);
  if(d==null)return {mode:'train',minutes:20,fare:0,src:'est',unknown:true};
  if(d<1.0)return {mode:'walk',minutes:Math.max(3,Math.ceil(d*1.3/4.2*60)),fare:0,src:'est'};
  const r=d*1.2;
  if(d<15)return legOf([{mode:'subway',line:'地鐵／市區電車',minutes:Math.round(8+r*2.2),fare:cityFare(r)}]);
  const go={mode:'subway',line:'到車站',minutes:12,fare:190},out={mode:'subway',line:'出站後',minutes:12,fare:190};
  if(d<90)return legOf([go,{mode:'jr',line:'JR／私鐵',minutes:Math.round(r/65*60+5),fare:r10(Math.max(190,r*14))},out]);
  const rail=d*1.2;
  return legOf([go,{mode:'shinkansen',line:'新幹線（指定席）',minutes:Math.round(rail/230*60+15),fare:r10(rail*17.5)+r10(1900+rail*9.4)},out]);
}
function taxi(a,b,region){
  const d=km(a,b);if(d==null)return null;
  const f=fares()[region]||fares().other;const road=d*1.3;
  let fare=f.base+Math.max(0,Math.ceil((road-f.baseKm)*1000/f.addM))*f.add;

}
function normLeg(l){if(!l||typeof l!=='object')return null;const mode=MODE[l.mode]?l.mode:'train';

  const o={mode,line:String(l.line||'').slice(0,40),minutes:Math.max(0,Math.round(+l.minutes||0)),fare:Math.max(0,Math.round(+l.fare||0)),src:'ai'};

  let prev=null;

      if(!it.leg||(it.leg.fromId&&it.leg.fromId!==prev.id)){it.leg=Object.assign(localLeg(prev,it),{fromId:prev.id});}

        const key='start:'+st.id;
        if(!it.leg||(it.leg.fromId&&it.leg.fromId!==key)||(it.leg.src==='est'&&(it.leg.unknown||(!it.leg.parts&&it.leg.mode!=='walk'))&&isNum(it.lat)))it.leg=Object.assign(localLeg(st,it),{fromId:key});

function legSpend(t,prev,it,l){

function costData(t){

  const ref=(a,b)=>{const tx=taxi(a,b,t.region);if(tx){taxiLo+=tx.lo;taxiHi+=tx.hi;}};
  t.days.forEach((d,i)=>{perDay.push({t:0,s:0,m:{}});let prev=null;

    <div class="field"><label>行程名稱</label><input class="inp" id="eTitle" value="${esc(t.title)}"></div>
    <div class="field row between"><div><label>出發日</label><input class="inp" type="date" id="eDate" value="${esc(t.startDate||'')}" style="width:170px"></div><div><label>天數</label><div class="stepper"><button data-act="step" data-t="nDays" data-d="-1">－</button><input id="nDays" value="${t.days.length}"><button data-act="step" data-t="nDays" data-d="1">＋</button></div></div></div>
    <div class="field"><label>人數</label><div class="stepper"><button data-act="step" data-t="nPeople" data-d="-1">－</button><input id="nPeople" value="${t.people}"><button data-act="step" data-t="nPeople" data-d="1">＋</button></div></div>
    ${flightFields(t.flights)}
    <div class="field"><label>跟誰去</label><div class="chips" data-single="1" id="eGroup">${Object.entries(GROUPS).map(([k,v])=>`<button class="chip ${t.group===k?'on':''}" data-act="chip" data-v="${k}">${v[0]}</button>`).join('')}</div></div>
    <div class="field"><label>喜歡什麼</label><div class="chips" id="eTags">${TAGS.map(x=>`<button class="chip ${(t.tags||[]).includes(x)?'on':''}" data-act="chip" data-v="${x}">${x}</button>`).join('')}</div></div>
    <div class="field"><label>步調</label><div class="chips" data-single="1" id="ePace">${Object.entries(PACE).map(([k,v])=>`<button class="chip ${t.pace===k?'on':''}" data-act="chip" data-v="${k}">${v[0]}</button>`).join('')}</div></div>
    <div class="field"><label>計程車費率地區</label><div class="chips" data-single="1" id="eRegion">${Object.entries(fares()).map(([k,v])=>`<button class="chip ${t.region===k?'on':''}" data-act="chip" data-v="${k}">${esc(v.name)}</button>`).join('')}</div></div>
    <div class="field"><label>一定要去</label><textarea class="inp" id="eMust">${esc(t.mustGo||'')}</textarea></div>
    <div class="field"><label>旅伴嚮導</label><div class="chips" data-single="1" id="eGuide">${allGuides().map(g=>`<button class="chip ${t.guide===g.id?'on':''}" data-act="chip" data-v="${g.id}"><span class="swatch" style="background:${g.color}"></span>${esc(g.name)}</button>`).join('')}</div></div>
    <button class="btn block" data-act="saveTripSet">儲存</button>
    <div style="height:14px"></div>
    <button class="opt" data-act="allVisited"><span class="e">🏁</span><div><b>旅行結束！把景點加到去過清單</b><span>預設標成「值得再去」，之後可以在設定裡改</span></div></button>
    <button class="opt danger" data-act="askDelTrip"><span class="e">🗑️</span><div><b>刪除這個行程</b></div></button>`);
  },
  saveTripSet:()=>{
    const t=curTrip();t.title=$('#eTitle').value.trim()||t.title;t.startDate=$('#eDate').value;t.people=Math.max(1,+$('#nPeople').value||1);
    t.group=chipVal('eGroup')[0]||t.group;t.tags=chipVal('eTags');t.pace=chipVal('ePace')[0]||t.pace;t.region=chipVal('eRegion')[0]||t.region;t.mustGo=$('#eMust').value.trim();t.guide=chipVal('eGuide')[0]||t.guide;
    const n=Math.min(14,Math.max(1,+$('#nDays').value||1));
    if(n>t.days.length)while(t.days.length<n)t.days.push({hotel:'',slots:emptySlots()});
    else if(n<t.days.length){const cut=t.days.slice(n);if(cut.some(d=>dayItems(d).length)){toast('後面幾天還有行程，已保留；請先刪掉那幾天的地點');}else t.days.length=n;}
    const oldAp=t.flights&&t.flights.arr&&t.flights.arr.ap;t.flights=readFlights();
    if(oldAp!==t.flights.arr.ap){const f0=dayItems(t.days[0])[0];if(f0)f0.leg=null;}
    t.days.forEach(d=>relinkLegs(t,d));
    if(S.dayIdx>=t.days.length)S.dayIdx=0;saveTrip(t);closeSheet();render();toast('已儲存');
  },
  allVisited:()=>{const t=curTrip();let n=0;for(const d of t.days)for(const it of dayItems(d)){if(it.kind==='food')continue;if(!visitedOf(it)){markVisited(it,'again');n++;}}closeSheet();render();toast(`加入了 ${n} 個地點到去過清單`);},
  askDelTrip:()=>openSheet(`<h2>確定要刪除嗎？</h2><div class="muted" style="margin-bottom:14px">刪除後沒辦法復原喔。</div><button class="btn block" style="background:#E2574C;box-shadow:0 4px 0 #A33A31" data-act="delTrip">確定刪除</button><div style="height:10px"></div><button class="btn ghost block" data-act="closeSheet">取消</button>`),
  delTrip:()=>{const id=S.tripId;S.trips=S.trips.filter(t=>t.id!==id);deleteTripStore(id);closeSheet();A.goHome();toast('已刪除');},
  aiFood:()=>aiFood(),
  foodQuick:el=>{$('#foodQ').value=el.dataset.v;aiFood();},
  foodAdd:el=>{const f=S.food.list[+el.dataset.i];if(!f)return;openSheet(`<h2>加到 Day ${S.food.day+1} 的哪個時段？</h2>${SLOTS.map(([k,l,e])=>`<button class="opt" data-act="foodAddTo" data-i="${el.dataset.i}" data-slot="${k}"><span class="e">${e}</span><div><b>${l}</b></div></button>`).join('')}`);},
  foodAddTo:el=>{const t=curTrip();const f=S.food.list[+el.dataset.i];if(!f)return;const day=t.days[S.food.day];const it=newItem({name:f.nameZh?`${f.name}`:f.name,nameJa:f.name,kind:'food',slot:el.dataset.slot,lat:f.lat,lng:f.lng,stay:60,cost:f.cost,note:f.reason,by:'user'});day.slots[it.slot].push(it);relinkLegs(t,day);saveTrip(t);closeSheet();toast(`已加入 Day ${S.food.day+1}・${SLOT_LABEL[it.slot]}`);},
  aiPass:()=>aiPass(),
  pickImg:el=>{const fi=$('#fileInp');fi.dataset.g=el.dataset.g;fi.value='';fi.click();},
  rmImg:el=>{delete S.images[el.dataset.g];saveImg(el.dataset.g);render();},
  setGuide:el=>{S.profile.activeGuide=el.dataset.g;saveProfile();render();},
  addGuide:()=>{const name=$('#cgName').value.trim();if(!name)return toast('先輸入角色名稱');const g={id:'c'+uid(),name,color:$('#cgColor').value,credit:$('#cgCredit').value.trim(),custom:true};S.profile.customGuides=(S.profile.customGuides||[]).concat(g);saveProfile();render();toast('新增好了，記得放張圖片～');},
  rmGuide:el=>{const id=el.dataset.g;S.profile.customGuides=(S.profile.customGuides||[]).filter(g=>g.id!==id);if(S.profile.activeGuide===id)S.profile.activeGuide='miku';if(S.images[id]){delete S.images[id];saveImg(id);}saveProfile();render();},
  visSet:el=>{const v=S.profile.visited.find(x=>x.id===el.dataset.id);if(v){v.status=el.dataset.v;saveProfile();render();}},
  visDel:el=>{S.profile.visited=S.profile.visited.filter(x=>x.id!==el.dataset.id);saveProfile();render();},
  visAdd:()=>{const n=$('#visName').value.trim();if(!n)return;markVisited({name:n,nameJa:''},'never');render();},
  fareReset:()=>{S.profile.fares=JSON.parse(JSON.stringify(FARE_DEFAULT));saveProfile();render();toast('已恢復預設費率');}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const fn=A[el.dataset.act];if(fn){e.preventDefault();fn(el,e);}});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='startTime'){const t=curTrip();const d=t.days[+el.dataset.day];d.startTime=el.value;saveTrip(t);render();}
  else if(el.id==='hotelInp'){const t=curTrip();const d=t.days[+el.dataset.day];d.hotel=el.value.trim();relinkLegs(t,d);saveTrip(t);render();}
  else if(el.id==='foodDay'){S.food.day=+el.value;}
  else if(el.dataset&&el.dataset.fare){const [k,x]=el.dataset.fare.split('.');const v=+el.value;if(!(v>0))return toast('請輸入正數');S.profile.fares=fares();S.profile.fares[k][x]=v;saveProfile();}
  else if(el.id==='fileInp'){
    const f=el.files&&el.files[0];const g=el.dataset.g;if(!f||!g)return;
    shrink(f).then(d=>{S.images[g]=d;saveImg(g);render();toast('圖片換好了！');}).catch(()=>toast('這張圖讀不到，換一張試試'));
  }
});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='foodQ')S.food.q=el.value;else if(el.id==='hotelInp'){const t=curTrip();if(t&&t.days[+el.dataset.day])t.days[+el.dataset.day].hotel=el.value;}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='foodQ'){e.preventDefault();aiFood();}});
function shrink(file,max=360){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{const r=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*r));c.height=Math.max(1,Math.round(img.height*r));c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);let d=c.toDataURL('image/webp',0.85);if(!d.startsWith('data:image/webp'))d=c.toDataURL('image/png');if(d.length>230000)d=c.toDataURL('image/jpeg',0.8);res(d);};img.onerror=()=>{URL.revokeObjectURL(url);rej();};img.src=url;});}

/* ===================== 啟動 ===================== */
lsLoad();
pickHome();
render();
initCloud();
initAI();
</script>
</body>
</html>
